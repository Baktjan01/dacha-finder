<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dacha Finder</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Onest:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>


<!-- Header -->
<div class="header">
    <div class="header-row">
        <div class="logo">Dacha<span>Finder</span></div>
        <button class="filter-btn" onclick="toggleFilter()" id="filterBtn">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 4h12M4 8h8M6 12h4"/>
            </svg>
            Фильтр
        </button>
    </div>
    <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="8.5" cy="8.5" r="5.5"/>
            <path d="M15 15l-3-3"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Поиск по названию, месту…">
    </div>
</div>

<!-- Filter panel -->
<div class="filter-panel" id="filterPanel">
    <div class="filter-row">
        <div>
            <label>Цена от (сум)</label>
            <input type="number" id="fMinPrice" placeholder="0">
        </div>
        <div>
            <label>Цена до (сум)</label>
            <input type="number" id="fMaxPrice" placeholder="∞">
        </div>
    </div>
    <div style="margin-bottom:12px">
        <label>Комнат</label>
        <select id="fRooms">
            <option value="">Любое</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4+</option>
        </select>
    </div>
    <button class="filter-apply" onclick="applyFilter()">Применить</button>
</div>

<!-- Page: Catalog -->
<div class="page active" id="page-catalog">
    <div class="cards-grid" id="cardsList"></div>
</div>

<!-- Page: Favorites -->
<div class="page" id="page-favs">
    <div class="cards-grid" id="favsList"></div>
</div>

<!-- Page: Add -->
<div class="page" id="page-add">
    <div class="page-title">Добавить дачу</div>
    <div class="form-group">
        <label>Название *</label>
        <input type="text" id="fTitle" placeholder="Уютная дача у реки">
    </div>
    <div class="form-group">
        <label>Местоположение *</label>
        <input type="text" id="fLocation" placeholder="Ташкентская область, Паркент">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Цена в сутки (сум) *</label>
            <input type="number" id="fPrice" placeholder="150000">
        </div>
        <div class="form-group">
            <label>Комнат</label>
            <input type="number" id="fRoomsAdd" placeholder="3" min="1">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Площадь (соток)</label>
            <input type="number" id="fArea" placeholder="8">
        </div>
        <div class="form-group">
            <label>Телефон *</label>
            <input type="tel" id="fPhone" placeholder="+998 90 123 45 67">
        </div>
    </div>
    <div class="form-group">
        <label>Описание</label>
        <textarea id="fDesc" placeholder="Расскажите о даче: удобства, особенности…"></textarea>
    </div>
    <div class="form-group">
        <label>Ссылка на фото</label>
        <input type="file" id="fImg" placeholder="https://…">
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitDacha()">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 4v12M4 10h12"/>
        </svg>
        Опубликовать
    </button>
</div>

<!-- Bottom tabs -->
<nav class="tabs">
    <button class="tab active" id="tab-catalog" onclick="showPage('catalog')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="2"/>
            <rect x="14" y="3" width="7" height="7" rx="2"/>
            <rect x="3" y="14" width="7" height="7" rx="2"/>
            <rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
        Каталог
    </button>
    <button class="tab" id="tab-favs" onclick="showPage('favs')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 21l-7.5-7.5A5 5 0 0 1 11.5 6L12 6.5l.5-.5a5 5 0 0 1 7 7L12 21z"/>
        </svg>
        Избранное
    </button>
    <button class="tab" id="tab-add" onclick="showPage('add')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v8M8 12h8"/>
        </svg>
        Добавить
    </button>
</nav>

<!-- Detail modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
        <div class="modal-handle"></div>
        <div class="modal-img" id="mImg">🏡</div>
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-loc" id="mLoc"></div>
        <div class="modal-price" id="mPrice"></div>
        <div class="modal-info" id="mInfo"></div>
        <div class="modal-desc" id="mDesc"></div>
        <a class="modal-call" id="mPhone" href="#">📞 Позвонить</a>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="{% static 'js/home.js' %}"></script>
</body>
</html>
